            titleEl.textContent = title;

                icon.className = "w-16 h-16 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-2xl";
                icon.innerHTML = '<i class="fa-solid fa-check"></i>';

                icon.innerHTML = '<i class="fa-solid fa-circle-info"></i>';

                showModal('Batas Pengerjaan', 'Maaf, Anda sudah menggunakan batas maksimal 2 kali kesempatan pengerjaan asesmen ini.', 'error');

            }

            appState.user = {

                kelas: kelas,
                presensi: presensi,
                role: 'student',
                studentKey: studentKey
            };
            appState.currentView = 'student_dashboard';
            render();

                if (timerEl) {
                    const m = Math.floor(appState.timerRemaining / 60);
                    const s = appState.timerRemaining % 60;
                    timerEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
                    if (appState.timerRemaining <= 300) {
                        timerEl.className = "text-rose-600 font-bold animate-pulse";
                    }
                }
                if (appState.timerRemaining <= 0) {
                    clearInterval(appState.timerInterval);
                    showModal('Waktu Habis', 'Waktu pengerjaan telah selesai. Sistem akan mengirim jawaban Anda secara otomatis.', 'error');

                    html += `<p class="text-xs text-amber-600 font-semibold"><i class="fa-solid fa-circle-info mr-1"></i>Pasangkan pernyataan di sebelah kiri dengan pilihan yang tepat di sebelah kanan.</p>`;
                    html += `<div class="space-y-3 pt-2">`;
                    q.pairs.forEach((pair, pIdx) => {

        function saveAnswer(qId, val) {
            appState.answers[qId] = val;
        }

        function saveComplexAnswer(qId, optId) {
            if (!appState.answers[qId]) appState.answers[qId] = [];
            let list = appState.answers[qId];
            if (list.includes(optId)) {
                list = list.filter(item => item !== optId);
            } else {
                list.push(optId);
            }
            appState.answers[qId] = list;
        }

        function saveMatchingAnswer(qId, pairIdx, val) {
            if (!appState.answers[qId]) appState.answers[qId] = {};
            appState.answers[qId][pairIdx] = val;
        }

        function confirmSubmitExam() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            submitExam(false);
        }

        function submitExam(isTimeout) {
            // Calculate Score
            let totalScore = 0;
            let correctCount = 0;
            let totalQuestions = appState.questions.length;

            // Scoring weight: 35 questions total. Let's make each question worth weighted points to total 100.
            // Or simple percentage: (Correct / 35) * 100
            let scorePerItem = 100 / totalQuestions;

            appState.questions.forEach(q => {
                const userAns = appState.answers[q.id];
                if (q.type === 'pg') {
                    if (userAns === q.answer) correctCount++;
                } else if (q.type === 'pg_kompleks') {
                    if (Array.isArray(userAns)) {
                        // Check if exact match of arrays
                        const sortedUser = [...userAns].sort();
                        const sortedCorrect = [...q.answer].sort();
                        if (sortedUser.length === sortedCorrect.length && sortedUser.every((val, i) => val === sortedCorrect[i])) {
                            correctCount++;
                        }
                    }
                } else if (q.type === 'menjodohkan') {
                    if (userAns && typeof userAns === 'object') {
                        let allCorrect = true;
                        q.pairs.forEach((pair, pIdx) => {
                            if (userAns[pIdx] !== pair.right) allCorrect = false;
                        });
                        if (allCorrect) correctCount++;
                    }
                }
            });

            const finalScore = Math.round((correctCount / totalQuestions) * 100);

            // Record Attempt
            const studentKey = appState.user.studentKey;
            appState.attempts[studentKey] = (appState.attempts[studentKey] || 0) + 1;

            const resultRecord = {
                name: appState.user.name,
                kelas: appState.user.kelas,
                presensi: appState.user.presensi,
                score: finalScore,
                correct: correctCount,
                total: totalQuestions,
                timestamp: new Date().toLocaleString()
            };

            appState.resultsHistory.push(resultRecord);
            persistState();

            appState.lastResult = resultRecord;
            appState.currentView = 'result';
            render();
        }

            secS.classList.add('hidden');

            if (tab === 'questions') {
                btnQ.className = "px-6 py-3 rounded-xl font-bold text-sm bg-emerald-600 text-white shadow";
                secQ.classList.remove('hidden');
            } else if (tab === 'results') {
                btnR.className = "px-6 py-3 rounded-xl font-bold text-sm bg-emerald-600 text-white shadow";
                secR.classList.remove('hidden');
            } else if (tab === 'settings') {
                btnS.className = "px-6 py-3 rounded-xl font-bold text-sm bg-emerald-600 text-white shadow";
                secS.classList.remove('hidden');
            }
        }

        function triggerStudentSimulation() {
            appState.user = {
                name: "Uji Coba (Guru/Admin)",
                kelas: "IX A",
                presensi: "00",
                role: "student",
                studentKey: "simulasi_admin"
            };
            appState.simulatingStudent = true;
            appState.currentView = 'student_dashboard';
            render();
        }

        function editQuestionModal(qId) {
            const q = appState.questions.find(item => item.id === qId);
            if (!q) return;

            document.getElementById('editQId').value = q.id;
            document.getElementById('editQText').value = q.question;
            
            const container = document.getElementById('editQOptionsContainer');
            container.innerHTML = '';

            if (q.type === 'pg') {
                for (const [k, v] of Object.entries(q.options)) {
                    container.innerHTML += `
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">Opsi ${k} (Kunci benar: ${q.answer === k ? 'YA' : 'TIDAK'})</label>
                            <input type="text" id="editOpt_${k}" value="${v}" class="w-full p-2.5 rounded-lg border border-slate-200 text-sm">
                        </div>
                    `;
                }
            } else {
                container.innerHTML = `<p class="text-xs text-slate-400">Pengeditan khusus untuk tipe Pilihan Ganda standar.</p>`;
            }

            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveEditedQuestion() {
            const qId = parseInt(document.getElementById('editQId').value);
            const qText = document.getElementById('editQText').value;

            const q = appState.questions.find(item => item.id === qId);
            if (q) {
                q.question = qText;
                if (q.type === 'pg') {
                    ['A', 'B', 'C', 'D'].forEach(k => {
                        const valEl = document.getElementById(`editOpt_${k}`);
                        if (valEl) q.options[k] = valEl.value;
                    });
                }
                persistState();
                closeEditModal();
                render();
                showModal('Berhasil', 'Soal berhasil diperbarui.', 'success');
            }
        }

        function deleteQuestion(qId) {
            appState.questions = appState.questions.filter(item => item.id !== qId);
            persistState();
            render();
            showModal('Terhapus', 'Soal berhasil dihapus dari bank soal.', 'success');
        }

        function addNewQuestion() {
            const newId = appState.questions.length > 0 ? Math.max(...appState.questions.map(q => q.id)) + 1 : 1;
            appState.questions.push({
                id: newId,
                type: "pg",
                question: "Pertanyaan baru asesmen sumatif...",
                options: { A: "Opsi A", B: "Opsi B", C: "Opsi C", D: "Opsi D" },
                answer: "A"
            });
            persistState();
            render();
            showModal('Berhasil', 'Soal baru berhasil ditambahkan. Silakan klik tombol Edit untuk mengubah isi soal.', 'success');
        }

        function saveAdminSettings() {
            const schoolName = document.getElementById('settingSchoolName').value.trim();
            const newPass = document.getElementById('settingNewPassword').value.trim();

            if (schoolName) appState.schoolName = schoolName;
            if (newPass) appState.adminPassword = newPass;

            persistState();
            showModal('Berhasil', 'Pengaturan aplikasi berhasil disimpan.', 'success');
            render();
        }

        function exportResultsCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Nama,Kelas,Presensi,Benar,Total,Nilai,Waktu\n";
            appState.resultsHistory.forEach(r => {
                csvContent += `"${r.name}","${r.kelas}","${r.presensi}",${r.correct},${r.total},${r.score},"${r.timestamp}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "rekap_nilai_aswaja_ix.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function logout() {
            if (appState.timerInterval) clearInterval(appState.timerInterval);
            appState.user = null;
            appState.simulatingStudent = null;
            appState.currentView = 'login';
            render();
        }

        // Initialize on load
        window.onload = function() {
            initApp();
        };
    </script>
</body>
</html>
